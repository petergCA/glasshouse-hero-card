  const svgFor = (icon) => {

    const sz = 'width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);display:block;fill:currentColor';
    if (p) return `<svg viewBox="0 0 24 24" style="${sz}"><path d="${p}"/></svg>`;
    const g = (icon || '?').replace('mdi:', '').slice(0, 2).toUpperCase();
    return `<svg viewBox="0 0 24 24" style="${sz}"><rect x="2" y="2" width="20" height="20" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="12" y="16" font-size="9" text-anchor="middle" fill="currentColor" font-family="sans-serif">${g}</text></svg>`;
  };
  if (!customElements.get('ha-card')) customElements.define('ha-card', class extends HTMLElement {});
  customElements.define('ha-icon', class extends HTMLElement {
    static get observedAttributes() { return ['icon']; }
    connectedCallback() { this._r(); }
    attributeChangedCallback() { this._r(); }
    set icon(v) { this.setAttribute('icon', v); }
    _r() { this.innerHTML = svgFor(this.getAttribute('icon')); }
  });
  customElements.define('ha-state-icon', class extends HTMLElement {
    set stateObj(s) { this._s = s; this._r(); }
    set hass(h) { this._h = h; }

      const icon = (s && s.attributes.icon) || (s && DOMAIN_ICON[s.entity_id.split('.')[0]]) || 'mdi:help';

</head>
<body>
<div id="root"></div>
<div id="log"></div>
<script>
  /* ------------------------------------------------------------ demo data */
  const avatar = (bg1, bg2, skin) => 'data:image/svg+xml;utf8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${bg1}"/><stop offset="1" stop-color="${bg2}"/></linearGradient></defs>
      <rect width="96" height="96" fill="url(#g)"/>
      <circle cx="48" cy="40" r="17" fill="${skin}"/>
      <path d="M16 96c2-20 15-31 32-31s30 11 32 31z" fill="${skin}" opacity=".92"/>
    </svg>`);

  const st = (entity_id, state, attributes = {}) => ({
    entity_id, state: String(state), attributes, last_changed: new Date().toISOString(), last_updated: new Date().toISOString(),
  });

  const dayISO = (n) => { const d = new Date(); d.setDate(d.getDate() + n); d.setHours(12, 0, 0, 0); return d.toISOString(); };

  function makeStates(alerting) {
    const s = {};
    const add = (o) => { s[o.entity_id] = o; };
    add(st('weather.demo_home', 'partlycloudy', {
      friendly_name: 'Home', temperature: 17.8, temperature_unit: '°C', humidity: 62, wind_speed: 14, wind_speed_unit: 'km/h',
      supported_features: 1,
      forecast: [
        { datetime: dayISO(0), condition: 'partlycloudy', temperature: 21, templow: 11, precipitation_probability: 10 },
        { datetime: dayISO(1), condition: 'sunny', temperature: 23, templow: 12 },
        { datetime: dayISO(2), condition: 'rainy', temperature: 16, templow: 9 },
        { datetime: dayISO(3), condition: 'cloudy', temperature: 18, templow: 10 },
        { datetime: dayISO(4), condition: 'sunny', temperature: 22, templow: 11 },
      ],
    }));
    add(st('person.alex', 'home', { friendly_name: 'Alex Rivera', entity_picture: avatar('#3b4a7a', '#7a5ca8', '#e8c4a8') }));
    add(st('person.sam', alerting ? 'not_home' : 'home', { friendly_name: 'Sam Lee' }));
    add(st('person.jordan', alerting ? 'Work' : 'home', { friendly_name: 'Jordan Kim', entity_picture: avatar('#1f5f63', '#2c8a6e', '#c99a7a') }));
    add(st('input_boolean.mode_morning', 'off', { friendly_name: 'Morning' }));
    add(st('input_boolean.mode_movie', alerting ? 'off' : 'on', { friendly_name: 'Movie night' }));
    add(st('input_boolean.mode_bedtime', 'off', { friendly_name: 'Bedtime' }));
    add(st('input_boolean.mode_guest', 'on', { friendly_name: 'Guests' }));
    add(st('scene.mode_away', 'unknown', { friendly_name: 'Away' }));
    add(st('alarm_control_panel.demo', alerting ? 'armed_away' : 'armed_home', { friendly_name: 'House alarm' }));
    add(st('lock.front_door', 'locked', { friendly_name: 'Front Door Lock' }));
    add(st('lock.back_door', alerting ? 'unlocked' : 'locked', { friendly_name: 'Back Door Lock' }));
    add(st('lock.side_gate', 'locked', { friendly_name: 'Side Gate Lock' }));
    add(st('binary_sensor.front_door', 'off', { friendly_name: 'Front Door', device_class: 'door' }));
    add(st('binary_sensor.back_door', alerting ? 'on' : 'off', { friendly_name: 'Back Door', device_class: 'door' }));
    add(st('cover.garage', alerting ? 'open' : 'closed', { friendly_name: 'Garage', device_class: 'garage' }));
    add(st('binary_sensor.leak_kitchen', alerting ? 'on' : 'off', { friendly_name: 'Kitchen leak sensor', device_class: 'moisture' }));
    add(st('sensor.freezer_temp', alerting ? -6.2 : -18.4, { friendly_name: 'Freezer', unit_of_measurement: '°C', device_class: 'temperature' }));
    add(st('sensor.sensor_battery', alerting ? 9 : 81, { friendly_name: 'Hall sensor battery', unit_of_measurement: '%', device_class: 'battery' }));
    add(st('binary_sensor.smoke', 'off', { friendly_name: 'Smoke', device_class: 'smoke' }));
    add(st('sensor.house_power', alerting ? 3412 : 1284, { friendly_name: 'House power', unit_of_measurement: 'W', device_class: 'power' }));
    add(st('sensor.indoor_temp', 21.4, { friendly_name: 'Indoor temperature', unit_of_measurement: '°C', device_class: 'temperature' }));
    add(st('sensor.indoor_humidity', 46, { friendly_name: 'Indoor humidity', unit_of_measurement: '%', device_class: 'humidity' }));
    add(st('sensor.solar_today', 12.6, { friendly_name: 'Solar today', unit_of_measurement: 'kWh', device_class: 'energy' }));
    return s;
  }

  const CONFIG = {
    type: 'custom:glasshouse-hero-card',
    weather: 'weather.demo_home',
    people: ['person.alex', 'person.sam', 'person.jordan'],
    modes: [
      { entity: 'input_boolean.mode_morning', name: 'Morning', icon: 'mdi:weather-sunset-up' },
      { entity: 'input_boolean.mode_movie', name: 'Movie night', icon: 'mdi:movie-open' },
      { entity: 'input_boolean.mode_bedtime', name: 'Bedtime', icon: 'mdi:bed' },
      { entity: 'scene.mode_away', name: 'Away', icon: 'mdi:airplane' },
    ],
    security: {
      alarm: 'alarm_control_panel.demo',
      locks: ['lock.front_door', 'lock.back_door', 'lock.side_gate'],
      openings: ['binary_sensor.front_door', 'binary_sensor.back_door', 'cover.garage'],
    },
    alerts: [
      { entity: 'binary_sensor.leak_kitchen', state: 'on', name: 'Kitchen leak', severity: 'alert', icon: 'mdi:water-alert' },
      { entity: 'binary_sensor.smoke', state: 'on', name: 'Smoke detected', severity: 'alert', icon: 'mdi:smoke-detector-alert' },
      { entity: 'sensor.freezer_temp', above: -12, name: 'Freezer warming', severity: 'warn', icon: 'mdi:fridge-alert' },
      { entity: 'cover.garage', state: 'open', name: 'Garage open', severity: 'warn', icon: 'mdi:garage-open' },
      { entity: 'sensor.sensor_battery', below: 15, name: 'Hall sensor battery', severity: 'info', icon: 'mdi:battery-alert' },
    ],
    stats: [
      { entity: 'sensor.house_power', name: 'Power', icon: 'mdi:flash' },
      { entity: 'sensor.indoor_temp', name: 'Inside', icon: 'mdi:home-thermometer' },
      { entity: 'sensor.indoor_humidity', name: 'Humidity', icon: 'mdi:water-percent' },
      { entity: 'sensor.solar_today', name: 'Solar today' },
    ],
  };

  /* --------------------------------------------------------- mock hass */
  function makeHass(card, alerting, log) {
    let hass;
    const build = (states) => ({
      states,
      language: 'en',
      locale: { language: 'en', time_format: 'language', number_format: 'language', time_zone: 'local' },
      config: { time_zone: 'UTC' },
      entities: { 'sensor.indoor_temp': { display_precision: 1 } },
      callService(domain, service, data) {
        log(`callService ${domain}.${service} ${JSON.stringify(data)}`);
        const id = data.entity_id;
        const cur = hass.states[id];
        if (!cur) return Promise.resolve();
        let next = cur.state;
        if (domain === 'homeassistant' && service === 'toggle') next = cur.state === 'on' ? 'off' : 'on';
        const states = { ...hass.states, [id]: { ...cur, state: next, last_updated: new Date().toISOString() } };
        hass = build(states);
        card.hass = hass;
        return Promise.resolve();
      },
      callWS(msg) {
        if (msg.type !== 'history/history_during_period') return Promise.reject(new Error('unsupported'));
        const start = new Date(msg.start_time).getTime() / 1000;
        const now = Date.now() / 1000;
        const out = {};
        msg.entity_ids.forEach((id, k) => {
          const base = Number(hass.states[id].state);
          const rows = [];
          for (let t = start, i = 0; t <= now; t += 900, i++) {
            const wave = Math.sin(i / (6 + k * 3)) * 0.18 + Math.sin(i / 2.3 + k) * 0.05;
            const v = id.includes('solar') ? Math.max(0, base * Math.min(1, i / 70)) : base * (1 + wave * (id.includes('power') ? 1.6 : 0.25));
            rows.push({ s: v.toFixed(2), lu: t });
          }
          out[id] = rows;
        });
        return Promise.resolve(out);
      },
    });
    hass = build(makeStates(alerting));
    return hass;
  }

  /* ----------------------------------------------------------- variants */
  const VARIANTS = {
    desktop:       { label: 'Desktop 1300 – all good',   width: 1252, alerting: false },
    desktopAlert:  { label: 'Desktop 1300 – alerts firing', width: 1252, alerting: true },
    medium:        { label: 'Tablet 760 – alerts firing', width: 760, alerting: true },
    phone:         { label: 'Phone 390 – all good',       width: 390 - 32, alerting: false },
    phoneAlert:    { label: 'Phone 390 – alerts firing',  width: 390 - 32, alerting: true },
    minimal:       { label: 'Minimal config (greeting + weather only)', width: 760, alerting: false, config: { type: 'custom:glasshouse-hero-card', weather: 'weather.demo_home', title: 'Welcome home' } },
  };
  const q = new URLSearchParams(location.search);
  const only = q.get('v');
  const logEl = document.getElementById('log');
  if (q.get('clean')) document.head.insertAdjacentHTML('beforeend', '<style>.variant h2,#log{display:none}.variant{margin:0}</style>');
  const log = (m) => { logEl.textContent += m + '\n'; };
  const root = document.getElementById('root');
  let phoneRow = null;
  for (const [key, v] of Object.entries(VARIANTS)) {
    if (only && !only.split(',').includes(key)) continue;
    const box = document.createElement('section');
    box.className = 'variant';
    box.innerHTML = `<h2>${v.label}</h2>`;
    const holder = document.createElement('div');
    holder.style.width = v.width + 'px';
    const card = document.createElement('glasshouse-hero-card');
    try {
      card.setConfig(v.config || CONFIG);
    } catch (e) { log('setConfig error: ' + e.message); }
    holder.appendChild(card);
    box.appendChild(holder);
    if (key.startsWith('phone') && !only) {
      if (!phoneRow) { phoneRow = document.createElement('div'); phoneRow.className = 'row'; root.appendChild(phoneRow); }
      phoneRow.appendChild(box);
    } else root.appendChild(box);
    card.hass = makeHass(card, v.alerting, (m) => log(`[${key}] ${m}`));
    card.addEventListener('hass-more-info', (e) => log(`[${key}] more-info ${e.detail.entityId}`));
    window['card_' + key] = card;
  }

  /* Config validation smoke tests */
  const bad = [
    { type: 'x', weather: 'sensor.nope' },
    { type: 'x', modes: [{ name: 'no entity' }] },
    { type: 'x', alerts: [{ entity: 'binary_sensor.a', severity: 'loud' }] },
  ];
  for (const b of bad) {
    try { document.createElement('glasshouse-hero-card').setConfig(b); log('validation MISSING for ' + JSON.stringify(b)); }
    catch (e) { log('ok rejects: ' + e.message); }
  }

  /* ?act=1 exercises interactions: toggle a mode, expand locks */
  if (q.get('act')) {
    setTimeout(() => {
      const c = window.card_desktop || Object.values(window).find((x) => x && x.tagName === 'GLASSHOUSE-HERO-CARD');
      const sr = c.shadowRoot;
      sr.querySelector('[data-act="mode"][data-i="0"]').click();
      sr.querySelector('[data-act="expand"][data-group="locks"]').click();
      sr.querySelector('[data-act="locks"]').click();
      log('after toggle aria-pressed=' + sr.querySelector('[data-act="mode"][data-i="0"]').getAttribute('aria-pressed'));
      c.remove();
      log('removed; interval cleared=' + (c._tick === null));
    }, 300);
  }
</script>
</body>
</html>
